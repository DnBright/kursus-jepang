name: Deploy via FTP

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    steps:
    - name: Get Latest Code
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
        coverage: none

    - name: Install Composer Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install & Build Assets
      run: |
        npm install
        npm run build

    - name: Sync Files via SSH/rsync
      env:
        SSH_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y sshpass rsync
        echo "Memulai proses sinkronisasi rsync ke server..."
        sshpass -p "$SSH_PASSWORD" rsync -avz --exclude '.git' --exclude 'node_modules' --exclude 'vendor' --exclude 'tests' --exclude '.env' --exclude 'phpunit.xml' --exclude 'README.md' -e "ssh -o StrictHostKeyChecking=no -p 22" ./ ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:public_html/kursusjepangonline.com/
